# ============================================================
# folia-android 自动同步上游 & 构建 APK 工作流
# 放到仓库的 .github/workflows/sync-and-build.yml
# ============================================================
name: Sync Upstream & Build APK

on:
  # 每天 UTC 02:00（北京时间 10:00）自动同步一次
  schedule:
    - cron: "0 2 * * *"
  # 也可以手动触发
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run（不实际推送）"
        type: boolean
        default: false

permissions:
  contents: write   # 允许推送代码和创建 Release

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行同步 & 构建脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 sync_and_build.py ${{ github.event.inputs.dry_run && '--dry-run' || '' }}
#（注：内容由AI生成）
